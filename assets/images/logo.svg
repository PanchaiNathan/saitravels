<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>
    <linearGradient id="logoNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023047" />
      <stop offset="100%" stop-color="#0B1E36" />
    </linearGradient>
  </defs>
  <!-- Icon Mark -->
  <g transform="translate(4, 6)">
    <!-- Rounded Background Hexagon/Shield -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#logoNavy)"/>
    <rect x="1" y="1" width="46" height="46" rx="13" stroke="url(#logoGold)" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Stylized Highway / Pin / Car Path -->
    <path d="M14 38 L22 14 L26 14 L34 38" stroke="url(#logoGold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="24" y1="20" x2="24" y2="34" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 2" stroke-linecap="round"/>
    
    <!-- Speed Wings / Pin Accent -->
    <circle cx="24" cy="14" r="3.5" fill="url(#logoGold)"/>
    <circle cx="24" cy="14" r="1.5" fill="#0B1E36"/>
  </g>
  
  <!-- Text Mark -->
  <g transform="translate(62, 38)">
    <text font-family="'Plus Jakarta Sans', 'Poppins', 'Segoe UI', sans-serif" font-weight="900" font-size="26" letter-spacing="-0.5" fill="#0B1E36">SAI</text>
    <text x="56" font-family="'Plus Jakarta Sans', 'Poppins', 'Segoe UI', sans-serif" font-weight="800" font-size="26" letter-spacing="-0.5" fill="url(#logoGold)">TRAVEL</text>
    <text x="2" y="13" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="600" font-size="9" letter-spacing="2.2" fill="#64748B">COMFORT &bull; SAFETY &bull; 24/7</text>
  </g>
</svg>
